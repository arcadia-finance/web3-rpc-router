[project]
name = "web3-rpc-router"
version = "0.5.0"
description = "Multi-provider RPC routing for web3.py with health checking"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "requests>=2.34.2",
    "web3>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web3_rpc_router"]

[tool.uv]
exclude-newer = "4 weeks"
exclude-newer-package = { aiohttp = "2026-10-06T00:00:00Z", certifi = "2026-10-21T00:00:00Z" }

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
